<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calcul du taux d'alcool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      body {
        background: linear-gradient(135deg, #f8f9fa, #e9ecef);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .card {
        border: none;
        border-radius: 18px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      }

      .card-header {
        background: linear-gradient(90deg, #0d6efd, #5ea1ff);
        color: white;
        border-radius: 18px 18px 0 0 !important;
      }

      .form-check-input:checked {
        background-color: #0d6efd;
        border-color: #0d6efd;
      }

      .result-box {
        background: #f1f3f5;
        border-radius: 12px;
        padding: 14px 16px;
        font-weight: 600;
        color: #212529;
      }
    </style>
  </head>
  <body>
    <div class="container py-4">
      <div class="row justify-content-center g-4">
        <div class="col-md-8 col-lg-6">
          <form id="alcoolForm" class="card">
            <div class="card-header text-center py-3">
              <h2 class="mb-0">Calcul du taux d'alcool</h2>
            </div>

            <div class="card-body p-4">
              <header class="mb-4">
                <h4 class="mb-3">Informations personnelles</h4>

                <div class="mb-3">
                  <label for="poids" class="form-label">Poids (kg)</label>
                  <input type="number" id="poids" name="poids" class="form-control" min="0" step="0.1" required />
                </div>

                <div>
                  <label class="form-label d-block mb-2">Genre</label>
                  <div class="d-flex gap-4">
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="genre" id="homme" value="homme" checked />
                      <label class="form-check-label" for="homme">Homme</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="genre" id="femme" value="femme" />
                      <label class="form-check-label" for="femme">Femme</label>
                    </div>
                  </div>
                </div>
              </header>

              <main>
                <h4 class="mb-3">Boisson consommée</h4>

                <div class="mb-3">
                  <label for="volume" class="form-label">Volume (ml)</label>
                  <input type="number" id="volume" name="volume" class="form-control" min="0" step="1" required />
                </div>

                <div class="mb-3">
                  <label for="degre" class="form-label">Degré (%)</label>
                  <input type="number" id="degre" name="degre" class="form-control" min="0" max="100" step="0.1" required />
                </div>

                <div class="d-grid">
                  <button type="submit" class="btn btn-primary btn-lg">Ajouter la consommation</button>
                </div>

                <div class="result-box mt-4" id="resultat">Taux d'alcool dans le sang : --</div>
              </main>
            </div>
          </form>
        </div>
      </div>

      <div class="row justify-content-center mt-4">
        <div class="col-12 col-lg-10">
          <div class="card">
            <div class="card-header text-center">
              <h4 class="mb-0">Historique des consommations</h4>
            </div>
            <div class="card-body p-0">
              <div class="table-responsive">
                <table class="table table-striped table-hover mb-0">
                  <thead class="table-light">
                    <tr>
                      <th>#</th>
                      <th>Volume</th>
                      <th>Degré</th>
                      <th>Heure</th>
                      <th>Temps écoulé</th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody id="historiqueTableBody"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const STORAGE_KEY = 'alcoolConsommations';

      function formatDateTimeLocal(date) {
        const pad = (value) => String(value).padStart(2, '0');
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
      }

      function getTauxInitial(data) {
        const facteur = data.genre === 'homme' ? 0.7 : 0.6;
        return (data.volume * (data.degre / 100) * 0.8) / (data.poids * facteur);
      }

      function calculerTauxActuel(data) {
        const initial = getTauxInitial(data);
        if (!data.dateBoisson) return { initial, actuel: initial, heures: 0 };

        const heureBoisson = new Date(data.dateBoisson).getTime();
        const heuresPassees = (Date.now() - heureBoisson) / (1000 * 60 * 60);
        const actuel = Math.max(initial - heuresPassees * 0.15, 0);

        return { initial, actuel, heures: heuresPassees };
      }

      function getHistorique() {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      }

      function formatTempsEcoule(dateBoisson) {
        const diffMs = Math.max(Date.now() - new Date(dateBoisson).getTime(), 0);
        const totalMinutes = Math.floor(diffMs / 60000);
        const heures = Math.floor(totalMinutes / 60);
        const minutes = totalMinutes % 60;
        return `${heures}h${String(minutes).padStart(2, '0')}`;
      }

      function sauvegarderHistorique(historique) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(historique));
      }

      function ajouterConso() {
        const conso = {
          id: Date.now(),
          poids: Number(document.getElementById('poids').value),
          genre: document.querySelector('input[name="genre"]:checked').value,
          volume: Number(document.getElementById('volume').value),
          degre: Number(document.getElementById('degre').value),
          dateBoisson: formatDateTimeLocal(new Date())
        };

        const historique = getHistorique();
        historique.push(conso);
        sauvegarderHistorique(historique);
        return conso;
      }

      function calculerTauxGlobal() {
        const historique = getHistorique();
        if (!historique.length) {
          document.getElementById('resultat').textContent = "Taux d'alcool dans le sang : --";
          return;
        }

        let total = 0;
        for (const item of historique) {
          const { actuel } = calculerTauxActuel(item);
          total += actuel;
        }

        document.getElementById('resultat').textContent = `Taux d'alcool dans le sang : ${total.toFixed(2)} g/L`;
      }

      function afficherHistorique() {
        const historique = getHistorique();
        const tbody = document.getElementById('historiqueTableBody');

        if (!historique.length) {
          tbody.innerHTML = `
            <tr>
              <td colspan="6" class="text-center text-muted py-4">Aucune consommation enregistrée</td>
            </tr>
          `;
          return;
        }

        tbody.innerHTML = historique
          .map((item, index) => {
            const dateBoisson = new Date(item.dateBoisson);
            const temps = formatTempsEcoule(item.dateBoisson);

            return `
              <tr>
                <td>${index + 1}</td>
                <td>${item.volume} ml</td>
                <td>${item.degre} %</td>
                <td>${dateBoisson.toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' })}</td>
                <td>${temps}</td>
                <td>
                  <button class="btn btn-sm btn-danger" data-id="${item.id}">Supprimer</button>
                </td>
              </tr>
            `;
          })
          .join('');

        document.querySelectorAll('button[data-id]').forEach((button) => {
          button.addEventListener('click', () => {
            const id = Number(button.dataset.id);
            const next = getHistorique().filter((item) => item.id !== id);
            sauvegarderHistorique(next);
            afficherHistorique();
            calculerTauxGlobal();
          });
        });
      }

      document.getElementById('alcoolForm').addEventListener('submit', function (e) {
        e.preventDefault();
        ajouterConso();
        afficherHistorique();
        calculerTauxGlobal();
      });

      afficherHistorique();
      calculerTauxGlobal();

      setInterval(() => {
        afficherHistorique();
        calculerTauxGlobal();
      }, 60000);
    </script>
  </body>
</html>
