<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calcul du taux d'alcool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body>
    <div class="container py-4">
        <div class="row justify-content-center g-4">
            <div class="col-md-8 col-lg-6">
                <form id="alcoolForm" class="card">
                    <div class="card-header text-center py-3">
                        <h2 class="mb-0">Calcul du taux d'alcool</h2>
                    </div>

                    <div class="card-body p-4">
                        <header class="mb-4">
                            <h4 class="mb-3">Informations personnelles</h4>

                            <div class="mb-3">
                                <label for="poids" class="form-label">Poids (kg)</label>
                                <input type="number" id="poids" name="poids" class="form-control" min="0" step="0.1"
                                    required />
                            </div>

                            <div>
                                <label class="form-label d-block mb-2">Genre</label>
                                <div class="d-flex gap-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="genre" id="homme"
                                            value="homme" checked />
                                        <label class="form-check-label" for="homme">Homme</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="genre" id="femme"
                                            value="femme" />
                                        <label class="form-check-label" for="femme">Femme</label>
                                    </div>
                                </div>
                            </div>
                        </header>

                        <main>
                            <h4 class="mb-3">Boisson consommée</h4>

                            <div class="mb-3">
                                <label for="volume" class="form-label">Volume (ml)</label>
                                <input type="number" id="volume" name="volume" class="form-control" min="0" step="1"
                                    required />
                            </div>

                            <div class="mb-3">
                                <label for="degre" class="form-label">Degré (%)</label>
                                <input type="number" id="degre" name="degre" class="form-control" min="0" max="100"
                                    step="0.1" required />
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">Ajouter la consommation</button>
                            </div>

                            <div class="result-box mt-4" id="resultat">Taux d'alcool dans le sang : --</div>
                        </main>
                    </div>
                </form>
            </div>
        </div>

        <div class="row justify-content-center mt-4">
            <div class="col-12 col-lg-10">
                <div class="card">
                    <div class="card-header text-center">
                        <h4 class="mb-0">Historique des consommations</h4>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>#</th>
                                        <th>Volume</th>
                                        <th>Degré</th>
                                        <th>Heure</th>
                                        <th>Temps écoulé</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody id="historiqueTableBody">
                                    <td>1</td>
                                    <td>volume</td>
                                    <td>degré</td>
                                    <td>heure</td>
                                    <td>tmp ecoulé</td>
                                    <td>action</td>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>

</html>
